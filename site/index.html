<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twos</title>
    <meta name="description" content="Watch five trained models play 2048 and see what each one is thinking, move by move. Or play it yourself." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#eef1f5" />
    <meta property="og:title" content="Twos" />
    <meta property="og:description" content="Watch five trained models play 2048 and see what each one is thinking, move by move." />
    <meta property="og:image" content="https://charliehubbard7.github.io/2048-rl-sandbox/preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Shantell+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/watch.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-top">
        <h1 class="wordmark">Twos</h1>
        <nav class="links">
          <a class="link" href="methodology.html">How I built it</a>
          <a class="link" href="https://github.com/CharlieHubbard7/2048-rl-sandbox">GitHub</a>
        </nav>
      </div>
      <div class="tabs" role="tablist" aria-label="Mode">
        <button type="button" role="tab" class="tab" id="tab-watch" aria-controls="watch" aria-selected="true">Watch the AI</button>
        <button type="button" role="tab" class="tab" id="tab-play" aria-controls="play" aria-selected="false" tabindex="-1">Play yourself</button>
      </div>
    </header>

    <!-- ---- Watch the AI ------------------------------------------------------ -->
    <main class="watch" id="watch" role="tabpanel" aria-labelledby="tab-watch">
      <section class="stage" aria-label="The AI's game">
        <div class="model-picker" id="model" role="radiogroup" aria-label="Model"></div>
        <p class="model-blurb" id="model-blurb"></p>

        <div class="stats">
          <span>Score <strong id="ai-score">0</strong></span>
          <span>Move <strong id="ai-moves">0</strong></span>
          <span>Best <strong id="ai-best">2</strong></span>
          <button type="button" class="link" id="ai-new">New game</button>
        </div>

        <div class="board" id="ai-board" aria-label="AI board"></div>

        <div class="transport">
          <div class="pace" id="pace" role="radiogroup" aria-label="Pace">
            <button type="button" role="radio" data-pace="step" aria-checked="true">One move</button>
            <button type="button" role="radio" data-pace="slow" aria-checked="false">Slow</button>
            <button type="button" role="radio" data-pace="fast" aria-checked="false">Fast</button>
          </div>
          <button type="button" class="button button-primary" id="ai-go" title="Space">Next move</button>
        </div>
      </section>

      <section class="mind" aria-labelledby="mind-title">
        <h2 id="mind-title">What it's thinking</h2>
        <div class="futures" id="futures"></div>
        <p class="verdict" id="verdict" aria-live="polite"></p>

        <section class="explainer" aria-labelledby="explainer-title">
          <header class="explainer-head">
            <h2 id="explainer-title">How it decides</h2>
            <div class="explainer-controls">
              <ol class="ex-steps" id="ex-steps"></ol>
              <button type="button" class="icon-button" id="ex-play" aria-label="Pause the explanation">❚❚</button>
            </div>
          </header>
          <p class="ex-caption" id="ex-caption"></p>
          <div class="ex-figure" id="ex-figure"></div>
        </section>

        <details class="inside" id="inside">
          <summary><span id="why-title">Inside the numbers</span></summary>
          <div class="why" id="why"></div>
        </details>
      </section>
    </main>

    <!-- ---- Play yourself ----------------------------------------------------- -->
    <main class="play" id="play" role="tabpanel" aria-labelledby="tab-play" hidden>
      <section class="player" aria-label="Your game">
        <div class="player-head">
          <p class="caption"><span class="for-keys">Arrow keys or WASD.</span><span class="for-touch">Swipe to move.</span></p>
          <div class="scores">
            <div class="score"><span>Score</span><strong id="you-score">0</strong></div>
            <div class="score"><span>Best</span><strong id="you-best">0</strong></div>
          </div>
        </div>
        <div class="board" id="you-board" aria-label="Your board"></div>
        <div class="player-foot">
          <button type="button" class="link" id="hint">Ask the search for a hint</button>
          <button type="button" class="button" id="new-game">New game</button>
        </div>
        <p class="hint-text" id="hint-text" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
