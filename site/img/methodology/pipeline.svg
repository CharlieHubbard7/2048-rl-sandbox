<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" font-family="Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>From training in Python to playing in the browser</title>
<rect width="720" height="170" fill="#ffffff"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687488"/></marker></defs>
<rect x="12" y="20" width="124" height="56" rx="8" fill="#fff" stroke="#d5dce6"/>
<text x="74.0" y="44.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Train</text>
<text x="74.0" y="61.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">NumPy + PyTorch</text>
<rect x="154" y="20" width="124" height="56" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="216.0" y="44.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Export</text>
<text x="216.0" y="61.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">prune, int16, gzip</text>
<line x1="138" y1="48" x2="152" y2="48" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="296" y="20" width="124" height="56" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="358.0" y="44.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Ship</text>
<text x="358.0" y="61.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">site/models</text>
<line x1="280" y1="48" x2="294" y2="48" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="438" y="20" width="124" height="56" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="500.0" y="44.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Worker</text>
<text x="500.0" y="61.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">plain JavaScript</text>
<line x1="422" y1="48" x2="436" y2="48" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="580" y="20" width="124" height="56" rx="8" fill="#fff" stroke="#d5dce6"/>
<text x="642.0" y="44.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Board</text>
<text x="642.0" y="61.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">your browser</text>
<line x1="564" y1="48" x2="578" y2="48" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<path d="M 216 92 v 14 h 284 v -14" fill="none" stroke="#d9694f" stroke-width="1.5"/>
<text x="358.0" y="128.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="600">parity tests: the JavaScript must reproduce</text>
<text x="358.0" y="146.0" font-size="13" fill="#687488" text-anchor="middle" font-weight="500">Python's moves, values and network outputs</text>
</svg>
