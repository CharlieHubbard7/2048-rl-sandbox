<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>The shared network shape for DQN and PPO</title>
<rect width="720" height="250" fill="#ffffff"/>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#687488"/></marker></defs>
<rect x="16" y="96" width="120" height="54" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="76.0" y="119.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Board</text>
<text x="76.0" y="136.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">16 one-hot planes</text>
<rect x="156" y="96" width="120" height="54" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="216.0" y="119.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">2×2 conv</text>
<text x="216.0" y="136.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">128 × 3 × 3</text>
<line x1="138" y1="123" x2="154" y2="123" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="296" y="96" width="120" height="54" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="356.0" y="119.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">2×2 conv</text>
<text x="356.0" y="136.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">128 × 2 × 2</text>
<line x1="278" y1="123" x2="294" y2="123" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="436" y="96" width="120" height="54" rx="8" fill="#f4f6f9" stroke="#d5dce6"/>
<text x="496.0" y="119.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">Dense</text>
<text x="496.0" y="136.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">256</text>
<line x1="418" y1="123" x2="434" y2="123" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="576" y1="112" x2="596" y2="60" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="576" y1="134" x2="596" y2="186" stroke="#687488" stroke-width="1.5" marker-end="url(#head)"/>
<rect x="598" y="30" width="110" height="54" rx="8" fill="#fff" stroke="#d5dce6"/>
<text x="653.0" y="53.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">DQN head</text>
<text x="653.0" y="70.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">4 Q-values</text>
<rect x="598" y="166" width="110" height="54" rx="8" fill="#fff" stroke="#d5dce6"/>
<text x="653.0" y="189.0" font-size="13" fill="#1d2738" text-anchor="middle" font-weight="700">PPO heads</text>
<text x="653.0" y="206.0" font-size="12" fill="#687488" text-anchor="middle" font-weight="500">4 probs + value</text>
<text x="16.0" y="30.0" font-size="13" fill="#1d2738" text-anchor="start" font-weight="700">Same trunk, different heads.</text>
<text x="16.0" y="50.0" font-size="13" fill="#687488" text-anchor="start" font-weight="500">2×2 kernels look at exactly the neighbour pairs that can merge.</text>
</svg>
