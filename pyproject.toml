[project]
name = "rl2048"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode arrows and multiplication signs in prose

[tool.ruff.lint.per-file-ignores]
"scripts/figures.py" = ["E501"]  # long lines are SVG markup, clearer unbroken
